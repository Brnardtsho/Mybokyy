name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Unzip & Extract
      run: |
        unzip -o *.zip
        # Move inner files to root if inside a folder
        BUILD_FILE=$(find . -maxdepth 3 -name "build.gradle*" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          DIR=$(dirname "$BUILD_FILE")
          if [ "$DIR" != "." ]; then
            cp -r $DIR/* .
          fi
        fi

    - name: Generate Gradle Wrapper if missing
      run: |
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found, generating wrapper..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
