name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract Zip and move files to root
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          echo "Unzipping archive..."
          unzip -o *.zip -d temp_extracted
          # Find where gradlew is located and move everything from that directory to root
          GRADLEW_PATH=$(find temp_extracted -name gradlew)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -rn "$PROJECT_DIR"/* .
          fi
          rm -rf temp_extracted
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
