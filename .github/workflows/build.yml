name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip Archive
      run: |
        unzip -o *.zip
        # Move extracted files from subfolder to root if necessary
        GRADLEW_FILE=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_FILE" ]; then
          DIR=$(dirname "$GRADLEW_FILE")
          if [ "$DIR" != "." ]; then
            cp -r $DIR/* .
          fi
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
